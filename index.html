<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <div class="profile-pic">
        <img src="foto-perfil.jpeg" alt="foto de perfil" />
      </div>
      <div class="name-title">
        <h1>Gianfranco Micheloni</h1>
        <h2>Desarrollador Full Stack</h2>
        <div class="location">
          <img src="map-pin.svg" alt="pin de ubicacion" />
          <a
            target="_blank"
            href="https://www.google.com/maps/place/Posadas,+Misiones"
            >Argentina, Misiones, Posadas</a
          >
        </div>
        <div class="contact-info">
          <button class="mail-button" id="copy-email">
            <img src="mail.svg" alt="mail icon" />
            gmicheloni52@gmail.com
          </button>

          <span class="copy-msg" id="copy-msg">
            ¡Copiado al portapapeles!
          </span>

          <a
            target="_blank"
            class="contact-button"
            href="Gianfranco Micheloni - CV - Programador Full Stack.pdf"
            ><img
              class="button-image"
              src="file-user.svg"
              alt="curriculum image"
          /></a>
          <a
            class="contact-button"
            href="https://github.com/GMicheloni"
            target="_blank"
            ><img src="github.svg" alt="github image"
          /></a>
          <a
            class="contact-button"
            href="https://www.linkedin.com/in/gianmicheloni/"
            target="_blank"
            ><img class="button-image" src="linkedin.svg" alt="linkedin image"
          /></a>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
    <script src="index.js"></script>
  </body>
</html>
